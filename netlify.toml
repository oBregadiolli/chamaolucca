[build]
  command = "npm run build"
  publish = "dist"

# VITE_SUPABASE_URL e VITE_SUPABASE_ANON_KEY NÃO ficam aqui — configure no painel
# Netlify: Site settings → Environment variables (Production + Preview conforme necessário).

# SPA fallback: public/_redirects (/* /index.html 200). Não duplicar [[redirects]] aqui.

# index.html nunca deve ser cacheado pelo browser — garante que os chunks
# corretos (com hash novo) sempre sejam referenciados após um novo deploy.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(self)"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://*.supabase.co; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://api.mercadopago.com https://www.mercadopago.com.br; frame-src https://www.mercadopago.com.br https://www.mercadopago.com; base-uri 'self'; form-action 'self' https://www.mercadopago.com.br https://www.mercadopago.com"
